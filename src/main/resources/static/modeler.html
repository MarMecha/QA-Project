<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>BPMN Modeler</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/bpmn-js@11.5.0/dist/bpmn-modeler.development.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@11.5.0/dist/assets/diagram-js.css" />
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@11.5.0/dist/assets/bpmn-font/css/bpmn.css" />

  <style>
    html, body { height: 100%; margin: 0; font-family: sans-serif; }

    #canvas {
      height: 90vh;
      margin-right: 300px; /* δίνει χώρο για το chat panel */
      border: 1px solid #ccc;
      background-image: radial-gradient(#333 1.2px, transparent 1.2px);
      background-size: 30px 30px;
    }

    #employeeSelect { z-index: 1000; }
    .hidden         { display: none !important; }

    #paletteToggle {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1100;
    }

    #chatPanel {
      position: absolute;
      top: 60px;
      right: 0;
      width: 300px;
      height: calc(100% - 60px);
      border-left: 1px solid #ccc;
      background: #f9f9f9;
      overflow-y: auto;
      padding: 10px;
      z-index: 1000;
    }

    #chatMessages {
      font-size: 0.9em;
    }

    #chatMessages div {
      margin-bottom: 12px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center bg-light border-bottom p-2">
    <div>
      <button id="saveBtn"    class="btn btn-primary me-2">💾 Αποθήκευση</button>
      <button id="publishBtn" class="btn btn-outline-success me-2">Publish</button>
      <span   id="publishTick" class="text-success d-none">✅</span>
    </div>

    <div class="d-flex gap-2 align-items-center">
      <a href="admin-dashboard.html#diagramList" class="btn btn-outline-secondary">🗂 Διαγράμματα</a>
      <button id="closeBtn"  class="btn btn-secondary">Κλείσε</button>

      <div id="historyControls" class="d-flex align-items-center ms-3 gap-1">
        <button id="undoBtn" class="btn btn-outline-secondary btn-sm rounded-circle p-0 d-flex justify-content-center align-items-center" style="width:30px;height:30px;">&#x21ba;</button>
        <button id="redoBtn" class="btn btn-outline-secondary btn-sm rounded-circle p-0 d-flex justify-content-center align-items-center" style="width:30px;height:30px;">&#x21bb;</button>
      </div>

      <div id="zoomControls" class="d-flex align-items-center ms-3 gap-1">
        <button id="zoomOutBtn" class="btn btn-outline-secondary btn-sm px-2">-</button>
        <span id="zoomDisplay">100%</span>
        <button id="zoomInBtn" class="btn btn-outline-secondary btn-sm px-2">+</button>
      </div>
    </div>
  </div>

  <!-- "+" palette toggle -->
  <button id="paletteToggle" class="btn btn-outline-dark">+</button>

  <!-- BPMN canvas -->
  <div id="canvas"></div>

  <div id="chatPanel">
    <h6>🗨️ Συνομιλία</h6>
    <div id="chatMessages" style="max-height: 75vh; overflow-y: auto;"></div>

    <!-- Φόρμα αποστολής -->
    <div class="mt-3">
      <textarea id="chatInput" class="form-control mb-1" rows="2" placeholder="Γράψε μήνυμα..."></textarea>
      <button id="sendChatBtn" class="btn btn-primary w-100">Αποστολή</button>
    </div>
  </div>

  <!-- Popup επιλογής υπαλλήλου -->
  <select id="employeeSelect" class="form-select position-absolute d-none" style="width:200px;"></select>

  <!-- JavaScript -->
  <script>
    const bpmnModeler = new BpmnJS({ container: '#canvas' });

    let employees   = [];
    let published   = false;
    let diagramName = new URLSearchParams(window.location.search).get('name') || null;

    const emptyDiagram = `<?xml version="1.0" encoding="UTF-8"?>
      <bpmn:definitions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                        xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL"
                        xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI"
                        xmlns:dc="http://www.omg.org/spec/DD/20100524/DC"
                        id="Definitions_1" targetNamespace="http://bpmn.io/schema/bpmn">
        <bpmn:process id="Process_1" isExecutable="true">
          <bpmn:startEvent id="StartEvent_1"/>
        </bpmn:process>
        <bpmndi:BPMNDiagram id="BPMNDiagram_1">
          <bpmndi:BPMNPlane id="BPMNPlane_1" bpmnElement="Process_1">
            <bpmndi:BPMNShape id="StartEvent_1_di" bpmnElement="StartEvent_1">
              <dc:Bounds x="100" y="100" width="36" height="36"/>
            </bpmndi:BPMNShape>
          </bpmndi:BPMNPlane>
        </bpmndi:BPMNDiagram>
      </bpmn:definitions>`;

    async function loadInitial() {
      if (diagramName) {
        const res = await fetch(`/api/bpmn/${diagramName}`);
        if (res.ok) {
          const data = await res.json();
          published = data.published;
          updatePublishUI();
          return bpmnModeler.importXML(data.xml);
        }
      }
      return bpmnModeler.importXML(emptyDiagram);
    }

    async function loadEmployees() {
      const res = await fetch('/api/employees');
      employees = await res.json();
    }

    async function loadChatMessages(name) {
      if (!name) return;
      try {
        const res = await fetch(`/api/chat/${encodeURIComponent(name)}`);
        if (!res.ok) throw new Error(await res.text());
        const messages = await res.json();

        const chatBox = document.getElementById('chatMessages');
        chatBox.innerHTML = '';

        messages.forEach(msg => {
          const div = document.createElement('div');
          div.innerHTML = `<strong>${msg.sender || 'Χρήστης'}:</strong> ${msg.message}<br><small class="text-muted">${new Date(msg.sentAt).toLocaleString('el-GR')}</small>`;
          chatBox.appendChild(div);
        });
      } catch (err) {
        console.error('❌ Σφάλμα φόρτωσης chat:', err);
      }
    }

    async function saveDiagram(promptForName = true) {
      let name = diagramName;
      if (!name && promptForName) {
        name = prompt('Αποθήκευση ως:');
      }
      if (!name) return null;

      const result = await bpmnModeler.saveXML({ format: true });
      let xml = result.xml;

      if (!xml.includes('xmlns:camunda') && xml.includes('camunda:assignee')) {
        xml = xml.replace('<bpmn:definitions', '<bpmn:definitions xmlns:camunda="http://camunda.org/schema/1.0/bpmn"');
      }

      const res = await fetch('/api/bpmn', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, xml })
      });

      if (res.ok) {
        alert('✅ Αποθηκεύτηκε επιτυχώς!');
        diagramName = name;
        return name;
      }

      alert('❌ Αποτυχία αποθήκευσης');
      return null;
    }

    async function togglePublish() {
      const name = await saveDiagram(!diagramName);
      if (!name) return;

      try {
        const res = await fetch(`/api/bpmn/${encodeURIComponent(name)}/toggle`, { method: 'PUT' });
        if (!res.ok) throw new Error(await res.text());

        const data = await res.json();
        published = data.published;
        updatePublishUI();
      } catch (err) {
        console.error('❌ Σφάλμα δημοσίευσης:', err);
        alert('❌ Σφάλμα δημοσίευσης');
      }
    }

    function updatePublishUI() {
      const btn  = document.getElementById('publishBtn');
      const tick = document.getElementById('publishTick');
      if (published) {
        btn.textContent = 'Un-Publish';
        tick.classList.remove('d-none');
      } else {
        btn.textContent = 'Publish';
        tick.classList.add('d-none');
      }
    }

    function showEmployeeSelect(element, evt) {
      const select = document.getElementById('employeeSelect');
      select.innerHTML = '<option value="">-- Εκχώρηση --</option>';

      employees.forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp.fullName;
        opt.textContent = emp.fullName;
        select.appendChild(opt);
      });

      select.style.left = evt.pageX + 'px';
      select.style.top  = evt.pageY + 'px';
      select.classList.remove('d-none');

      select.onchange = () => {
        if (select.value) {
          const modeling = bpmnModeler.get('modeling');
          modeling.updateProperties(element, { 'camunda:assignee': select.value });
        }
        select.classList.add('d-none');
      };
    }

    function hideEmployeeSelect() {
      document.getElementById('employeeSelect').classList.add('d-none');
    }

    // κουμπιά header
    document.getElementById('saveBtn')   .addEventListener('click', () => saveDiagram());
    document.getElementById('publishBtn').addEventListener('click', togglePublish);
    document.getElementById('closeBtn')  .addEventListener('click', () => history.back());

    // DOM ready
    window.addEventListener('DOMContentLoaded', async () => {
      await loadInitial();
      await loadEmployees();
      await loadChatMessages(diagramName);

      const commandStack = bpmnModeler.get('commandStack');
      const canvas       = bpmnModeler.get('canvas');
      let   currentZoom  = 1;

      function updateZoomDisplay() {
        document.getElementById('zoomDisplay').textContent = Math.round(currentZoom * 100) + '%';
      }

      function setZoom(level) {
        currentZoom = Math.max(0.2, Math.min(4, level));
        canvas.zoom(currentZoom);
        updateZoomDisplay();
      }

      document.getElementById('zoomInBtn') .addEventListener('click', () => setZoom(currentZoom + 0.1));
      document.getElementById('zoomOutBtn').addEventListener('click', () => setZoom(currentZoom - 0.1));
      document.getElementById('undoBtn')   .addEventListener('click', () => commandStack.undo());
      document.getElementById('redoBtn')   .addEventListener('click', () => commandStack.redo());

      const eventBus = bpmnModeler.get('eventBus');
      eventBus.on('canvas.viewbox.changed', () => {
        currentZoom = canvas.zoom();
        updateZoomDisplay();
      });

      updateZoomDisplay();

      const paletteEl = document.querySelector('.djs-palette');
      if (paletteEl) paletteEl.classList.add('hidden');

      document.getElementById('paletteToggle').addEventListener('click', () => {
        if (paletteEl) paletteEl.classList.toggle('hidden');
      });

      document.getElementById('sendChatBtn').addEventListener('click', async () => {
        const messageInput = document.getElementById('chatInput');
        const messageText  = messageInput.value.trim();
        const senderName   = localStorage.getItem('employeeName');
        const processName  = diagramName;

        if (!messageText || !senderName || !processName) return;

        const messageData = {
          name: processName,        // το ίδιο "name" με το διάγραμμα
          message: messageText,
          sender: senderName
        };

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(messageData)
          });

          if (res.ok) {
            messageInput.value = ''; // καθάρισε το input
            await loadChatMessages(processName); // ανανέωσε chat
          } else {
            alert('❌ Σφάλμα αποστολής μηνύματος');
          }
        } catch (err) {
          console.error('❌ Σφάλμα API:', err);
        }
      });
    });

    // κλικ σε user task για ανάθεση
    bpmnModeler.get('eventBus').on('element.click', e => {
      const element = e.element;
      if (element.type === 'bpmn:UserTask') {
        showEmployeeSelect(element, e.originalEvent);
      } else {
        hideEmployeeSelect();
      }
    });
  </script>
</body>
</html>
