<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>BPMN Modeler</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/bpmn-js@11.5.0/dist/bpmn-modeler.development.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@11.5.0/dist/assets/diagram-js.css" />
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@11.5.0/dist/assets/bpmn-font/css/bpmn.css" />
  <link rel="stylesheet" href="css/Edit_dashboard.css" />

  <style>
    html, body { height: 100%; margin: 0; font-family: sans-serif; }

    #canvas {
      height: 90vh;
      margin-right: 300px; /* δίνει χώρο για το chat panel */
      border: 1px solid #ccc;
      background-image: radial-gradient(#333 1.2px, transparent 1.2px);
      background-size: 30px 30px;
    }

    .hidden         { display: none !important; }

    #paletteToggle {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1100;
    }

    #chatPanel {
      position: absolute;
      top: 60px;
      right: 0;
      width: 300px;
      height: calc(100% - 60px);
      border-left: 1px solid #ccc;
      background: #f9f9f9;
      overflow-y: auto;
      padding: 10px;
      z-index: 1000;
    }

    #chatMessages {
      font-size: 0.9em;
    }

    #chatMessages div {
      margin-bottom: 12px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center bg-light border-bottom p-2">
    <div></div>

    <div class="d-flex gap-2 align-items-center">
      <button id="closeBtn"  class="btn btn-secondary">Κλείσε</button>

      <div id="historyControls" class="d-flex align-items-center ms-3 gap-1">
        <button id="undoBtn" class="btn btn-outline-secondary btn-sm rounded-circle p-0 d-flex justify-content-center align-items-center" style="width:30px;height:30px;">&#x21ba;</button>
        <button id="redoBtn" class="btn btn-outline-secondary btn-sm rounded-circle p-0 d-flex justify-content-center align-items-center" style="width:30px;height:30px;">&#x21bb;</button>
      </div>

      <div id="zoomControls" class="d-flex align-items-center ms-3 gap-1">
        <button id="zoomOutBtn" class="btn btn-outline-secondary btn-sm px-2">-</button>
        <span id="zoomDisplay">100%</span>
        <button id="zoomInBtn" class="btn btn-outline-secondary btn-sm px-2">+</button>
      </div>
    </div>
  </div>

  <!-- "+" palette toggle -->
  <button id="paletteToggle" class="btn btn-outline-dark">+</button>

  <!-- BPMN canvas -->
  <div id="canvas"></div>

  <div id="chatPanel">
    <h6>🗨️ Συνομιλία</h6>
    <div id="chatMessages" style="max-height: 75vh; overflow-y: auto;"></div>

    <!-- Φόρμα αποστολής -->
    <div class="mt-3">
      <textarea id="chatInput" class="form-control mb-1" rows="2" placeholder="Γράψε μήνυμα..."></textarea>
      <button id="sendChatBtn" class="btn btn-primary w-100">Αποστολή</button>
    </div>
  </div>

  <!-- Κουμπί ολοκλήρωσης task -->
  <button id="completeBtn" class="btn btn-success position-absolute d-none" style="z-index:1000;">Ολοκληρώθηκε</button>
  <select id="employeeSelect" class="form-select position-absolute d-none" style="width:200px; z-index:1000;"></select>

  <!-- JavaScript -->
  <script>
    const assigneeOverlays = {};
    const completionOverlays = {};
    let employeeList = [];
    const qaModdle = {
      name: 'QA',
      uri: 'http://example.com/qa',
      prefix: 'qa',
      types: [
        { name: 'UserTask', extends: ['bpmn:UserTask'], properties: [{ name: 'completed', isAttr: true, type: 'Boolean' }] }
      ]
    };
    const camundaModdle = {
      name: 'Camunda',
      uri: 'http://camunda.org/schema/1.0/bpmn',
      prefix: 'camunda',
      xml: { tagAlias: 'lowerCase' },
      types: [
        { name: 'UserTask', extends: ['bpmn:UserTask'], properties: [{ name: 'assignee', isAttr: true, type: 'String' }] }
      ]
    };

    const bpmnModeler = new BpmnJS({
      container: '#canvas',
      moddleExtensions: { qa: qaModdle, camunda: camundaModdle }
    });

    let diagramName = new URLSearchParams(window.location.search).get('name') || null;

    const emptyDiagram = `<?xml version="1.0" encoding="UTF-8"?>
      <bpmn:definitions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                        xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL"
                        xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI"
                        xmlns:dc="http://www.omg.org/spec/DD/20100524/DC"
                        id="Definitions_1" targetNamespace="http://bpmn.io/schema/bpmn">
        <bpmn:process id="Process_1" isExecutable="true">
          <bpmn:startEvent id="StartEvent_1"/>
        </bpmn:process>
        <bpmndi:BPMNDiagram id="BPMNDiagram_1">
          <bpmndi:BPMNPlane id="BPMNPlane_1" bpmnElement="Process_1">
            <bpmndi:BPMNShape id="StartEvent_1_di" bpmnElement="StartEvent_1">
              <dc:Bounds x="100" y="100" width="36" height="36"/>
            </bpmndi:BPMNShape>
          </bpmndi:BPMNPlane>
        </bpmndi:BPMNDiagram>
      </bpmn:definitions>`;

    async function loadInitial() {
      if (diagramName) {
        const res = await fetch(`/api/bpmn/${diagramName}`);
        if (res.ok) {
          const data = await res.json();
          return bpmnModeler.importXML(data.xml);
        }
      }
      return bpmnModeler.importXML(emptyDiagram);
    }

    async function loadChatMessages(name) {
      if (!name) return;
      try {
        const res = await fetch(`/api/chat/${encodeURIComponent(name)}`);
        if (!res.ok) throw new Error(await res.text());
        const messages = await res.json();

        const chatBox = document.getElementById('chatMessages');
        chatBox.innerHTML = '';

        messages.forEach(msg => {
          const div = document.createElement('div');
          div.innerHTML = `<strong>${msg.sender || 'Χρήστης'}:</strong> ${msg.message}<br><small class="text-muted">${new Date(msg.sentAt).toLocaleString('el-GR')}</small>`;
          chatBox.appendChild(div);
        });
      } catch (err) {
        console.error('❌ Σφάλμα φόρτωσης chat:', err);
      }
    }

    let autoSaveTimeout;
    async function autoSave() {
      if (!diagramName) return;
      const result = await bpmnModeler.saveXML({ format: true });
      let xml = result.xml;
      if (!xml.includes('xmlns:camunda') && xml.includes('camunda:assignee')) {
        xml = xml.replace('<bpmn:definitions', '<bpmn:definitions xmlns:camunda="http://camunda.org/schema/1.0/bpmn"');
      }
      await fetch('/api/bpmn', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: diagramName, xml })
      });
    }

    function scheduleAutoSave() {
      clearTimeout(autoSaveTimeout);
      autoSaveTimeout = setTimeout(autoSave, 1000);
    }

    function updateAssigneeOverlay(element) {
      const overlays = bpmnModeler.get('overlays');
      const existing = assigneeOverlays[element.id];
      if (existing) overlays.remove(existing);

      const assignee = element.businessObject.get('camunda:assignee');
      if (assignee) {
        const div = document.createElement('div');
        div.className = 'assignee-label';
        div.textContent = assignee;
        const id = overlays.add(element, {
          position: { bottom: 2, right: 2 },
          html: div
        });
        assigneeOverlays[element.id] = id;
      }
    }

    function renderAssigneeOverlays() {
      const registry = bpmnModeler.get('elementRegistry');
      registry.filter(e => e.type === 'bpmn:UserTask').forEach(updateAssigneeOverlay);
    }

    function updateCompletionOverlay(element) {
      const overlays = bpmnModeler.get('overlays');
      const existing = completionOverlays[element.id];
      if (existing) overlays.remove(existing);

      const completed = element.businessObject.get('qa:completed');
      if (completed) {
        const div = document.createElement('div');
        div.className = 'completed-label';
        div.textContent = '✓ Ολοκληρώθηκε';
        const id = overlays.add(element, {
          position: { top: -10, right: 2 },
          html: div
        });
        completionOverlays[element.id] = id;
      }
    }

    function renderCompletionOverlays() {
      const registry = bpmnModeler.get('elementRegistry');
      registry.filter(e => e.type === 'bpmn:UserTask').forEach(updateCompletionOverlay);
    }

    function showCompleteBtn(element, evt) {
      const currentUser = localStorage.getItem('employeeName');
      const assignee = element.businessObject.get('camunda:assignee');
      if (assignee !== currentUser) {
        hideCompleteBtn();
        return;
      }
      const btn = document.getElementById('completeBtn');
      btn.textContent = element.businessObject.get('qa:completed') ? 'Μη ολοκληρωμένο' : 'Ολοκληρώθηκε';
      btn.style.left = evt.pageX + 'px';
      btn.style.top  = evt.pageY + 'px';
      btn.classList.remove('d-none');
      btn.onclick = async () => {
        const modeling = bpmnModeler.get('modeling');
        const prev = element.businessObject.get('qa:completed');
        const newVal = !(prev === true || prev === 'true');
        modeling.updateProperties(element, { 'qa:completed': newVal });
        updateCompletionOverlay(element);
        completionOverlays[element.id] ??= null;
        btn.classList.add('d-none');
        try {
          await fetch('/api/bpmn/assign-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ diagramName, taskId: element.id, assignee: assignee || '', completed: newVal })
          });
        } catch (err) {
          console.error('❌ Σφάλμα αποθήκευσης κατάστασης', err);
        }
        await autoSave();
      };
    }

    function hideCompleteBtn() {
      document.getElementById('completeBtn').classList.add('d-none');
    }

    function showEmployeeSelect(element, evt) {
      const select = document.getElementById('employeeSelect');
      select.innerHTML = '<option value="">-- Εκχώρηση --</option>';
      employeeList.forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp.fullName;
        opt.textContent = emp.fullName;
        select.appendChild(opt);
      });
      select.value = element.businessObject.get('camunda:assignee') || '';
      select.style.left = evt.pageX + 'px';
      select.style.top  = evt.pageY + 'px';
      select.classList.remove('d-none');

      const completeBtn = document.getElementById('completeBtn');
      completeBtn.textContent = element.businessObject.get('qa:completed') ? 'Μη ολοκληρωμένο' : 'Ολοκληρώθηκε';
      completeBtn.style.left = (evt.pageX + 210) + 'px';
      completeBtn.style.top  = evt.pageY + 'px';
      completeBtn.classList.remove('d-none');
      completeBtn.onclick = async () => {
        const modeling = bpmnModeler.get('modeling');
        const prev = element.businessObject.get('qa:completed');
        const newVal = !(prev === true || prev === 'true');
        modeling.updateProperties(element, { 'qa:completed': newVal });
        updateCompletionOverlay(element);
        completeBtn.classList.add('d-none');
        select.classList.add('d-none');
        try {
          await fetch('/api/bpmn/assign-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ diagramName, taskId: element.id, assignee: element.businessObject.get('camunda:assignee') || '', completed: newVal })
          });
        } catch (err) {
          console.error('❌ Σφάλμα αποθήκευσης κατάστασης', err);
        }
        await autoSave();
      };

      select.onchange = async () => {
        if (select.value) {
          const modeling = bpmnModeler.get('modeling');
          modeling.updateProperties(element, { 'camunda:assignee': select.value });
          updateAssigneeOverlay(element);
          try {
            await fetch('/api/bpmn/assign-status', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ diagramName, taskId: element.id, assignee: select.value, completed: element.businessObject.get('qa:completed') || false })
            });
          } catch (err) {
            console.error('❌ Σφάλμα αποθήκευσης εκχώρησης', err);
          }
          await autoSave();
        }
        select.classList.add('d-none');
        completeBtn.classList.add('d-none');
      };
    }

    function hideEmployeeSelect() {
      document.getElementById('employeeSelect').classList.add('d-none');
      document.getElementById('completeBtn').classList.add('d-none');
    }

    async function canEditDiagram() {
      const position = (localStorage.getItem('employeePosition') || '').toLowerCase();
      if (position.includes('qa')) return true;
      const user = localStorage.getItem('employeeName');
      if (!diagramName || !user) return false;
      try {
        const res = await fetch(`/api/qa/leader?diagramName=${encodeURIComponent(diagramName)}&employeeName=${encodeURIComponent(user)}`);
        if (res.ok) {
          const data = await res.json();
          return data.leader === true;
        }
      } catch (err) {
        console.error('leader check failed', err);
      }
      return false;
    }

    function restrictEditing() {
      document.getElementById('paletteToggle').classList.add('d-none');
      document.querySelector('.djs-palette')?.classList.add('hidden');
      const eventBus = bpmnModeler.get('eventBus');
      ['shape.create','shape.move','shape.delete','shape.resize','connection.create','connection.move','connection.delete']
        .forEach(cmd => eventBus.on('commandStack.' + cmd + '.canExecute', 5000, () => false));
      const contextPad = bpmnModeler.get('contextPad');
      contextPad.close();
      const style = document.createElement('style');
      style.innerHTML = '.djs-context-pad { display: none !important; }';
      document.head.appendChild(style);
    }

    // κουμπί κλεισίματος
    document.getElementById('closeBtn').addEventListener('click', () => history.back());

    // DOM ready
    window.addEventListener('DOMContentLoaded', async () => {
      await loadInitial();
      renderAssigneeOverlays();
      renderCompletionOverlays();
      await loadChatMessages(diagramName);
      const editable = await canEditDiagram();
      if (!editable) {
        restrictEditing();
      } else {
        try {
          const res = await fetch('/api/employees');
          if (res.ok) employeeList = await res.json();
        } catch (err) {
          console.error('❌ Σφάλμα φόρτωσης υπαλλήλων', err);
        }
      }

      const commandStack = bpmnModeler.get('commandStack');
      const canvas       = bpmnModeler.get('canvas');
      let   currentZoom  = 1;

      function updateZoomDisplay() {
        document.getElementById('zoomDisplay').textContent = Math.round(currentZoom * 100) + '%';
      }

      function setZoom(level) {
        currentZoom = Math.max(0.2, Math.min(4, level));
        canvas.zoom(currentZoom);
        updateZoomDisplay();
      }

      document.getElementById('zoomInBtn') .addEventListener('click', () => setZoom(currentZoom + 0.1));
      document.getElementById('zoomOutBtn').addEventListener('click', () => setZoom(currentZoom - 0.1));
      document.getElementById('undoBtn')   .addEventListener('click', () => commandStack.undo());
      document.getElementById('redoBtn')   .addEventListener('click', () => commandStack.redo());

      const eventBus = bpmnModeler.get('eventBus');
      eventBus.on('commandStack.changed', scheduleAutoSave);
      eventBus.on('canvas.viewbox.changed', () => {
        currentZoom = canvas.zoom();
        updateZoomDisplay();
      });

      updateZoomDisplay();

      const paletteEl = document.querySelector('.djs-palette');
      if (paletteEl) paletteEl.classList.add('hidden');

      document.getElementById('paletteToggle').addEventListener('click', () => {
        if (paletteEl) paletteEl.classList.toggle('hidden');
      });

      document.getElementById('sendChatBtn').addEventListener('click', async () => {
        const messageInput = document.getElementById('chatInput');
        const messageText  = messageInput.value.trim();
        const senderName   = localStorage.getItem('employeeName');
        const processName  = diagramName;

        if (!messageText || !senderName || !processName) return;

        const messageData = {
          name: processName,        // το ίδιο "name" με το διάγραμμα
          message: messageText,
          sender: senderName
        };

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(messageData)
          });

          if (res.ok) {
            messageInput.value = ''; // καθάρισε το input
            await loadChatMessages(processName); // ανανέωσε chat
          } else {
            alert('❌ Σφάλμα αποστολής μηνύματος');
          }
        } catch (err) {
          console.error('❌ Σφάλμα API:', err);
        }
      });
      
      eventBus.on('element.click', e => {
        const el = e.element;
        if (el.type === 'bpmn:UserTask') {
          if (editable) {
            showEmployeeSelect(el, e.originalEvent);
          } else {
            showCompleteBtn(el, e.originalEvent);
          }
        } else {
          if (editable) {
            hideEmployeeSelect();
          } else {
            hideCompleteBtn();
          }
        }
      });

      eventBus.on('element.changed', e => {
        if (e.element.type === 'bpmn:UserTask') {
          updateAssigneeOverlay(e.element);
          updateCompletionOverlay(e.element);
        }
      });
    });
  </script>
</body>
</html>
