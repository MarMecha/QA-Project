<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Διαχείριση Groups</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">👥 Διαχείριση Groups Υπαλλήλων</h1>

    <form id="groupForm" class="row g-3 mb-4">
      <div class="col-md-6">
        <label for="groupName" class="form-label">Όνομα Group</label>
        <input type="text" class="form-control" id="groupName" required>
      </div>
      <div class="col-md-6">
        <label for="memberSelect" class="form-label">Μέλη</label>
        <select id="memberSelect" class="form-select" multiple required></select>
        <div class="form-text">Κρατήστε Ctrl για πολλαπλή επιλογή</div>
      </div>
      <div class="col-12 d-flex justify-content-end">
        <button type="submit" class="btn btn-success">➕ Προσθήκη</button>
      </div>
    </form>

    <div id="formMsg" class="alert d-none"></div>

    <h2 class="mt-5">📂 Groups</h2>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Όνομα</th>
          <th>Μέλη</th>
          <th>Ενέργειες</th>
        </tr>
      </thead>
      <tbody id="groupTable"></tbody>
    </table>

    <a href="admin-dashboard.html" class="btn btn-secondary">⬅️ Πίσω στον Πίνακα Διαχείρισης</a>
  </div>

  <script>
    async function loadEmployees() {
      const res = await fetch('/api/employees');
      const employees = await res.json();
      const select = document.getElementById('memberSelect');
      select.innerHTML = '';
      employees.forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp.id;
        opt.textContent = `${emp.fullName} - ${emp.position}`;
        select.appendChild(opt);
      });
    }

    async function fetchGroups() {
      const res = await fetch('/api/groups');
      const groups = await res.json();
      const table = document.getElementById('groupTable');
      table.innerHTML = '';
      groups.forEach(g => {
        const members = g.members.map(m => m.fullName).join(', ');
        const row = `<tr>
          <td>${g.name}</td>
          <td>${members}</td>
          <td>
            <a href="assign-qa-process.html?groupId=${g.id}" class="btn btn-sm btn-primary me-2">Ανάθεση</a>
            <button class="btn btn-sm btn-danger" onclick="deleteGroup(${g.id})">🗑️ Διαγραφή</button>
          </td>
        </tr>`;
        table.innerHTML += row;
      });
    }

    async function deleteGroup(id) {
      if (!confirm('Σίγουρα θέλετε να διαγράψετε το group;')) return;
      await fetch(`/api/groups/${id}`, { method: 'DELETE' });
      fetchGroups();
    }

    document.getElementById('groupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('groupName').value;
      const memberSelect = document.getElementById('memberSelect');
      const memberIds = Array.from(memberSelect.selectedOptions).map(o => parseInt(o.value));
      const res = await fetch('/api/groups', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, memberIds })
      });
      const msg = document.getElementById('formMsg');
      msg.classList.remove('d-none', 'alert-success', 'alert-danger');
      msg.classList.add(res.ok ? 'alert-success' : 'alert-danger');
      msg.textContent = res.ok ? '✅ Προστέθηκε το group' : '❌ Σφάλμα προσθήκης';
      if (res.ok) e.target.reset();
      fetchGroups();
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadEmployees();
      fetchGroups();
    });
  </script>
</body>
</html>
