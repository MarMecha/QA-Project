<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>🧰 Form Builder Demo (Form.io)</title>
  <script src="https://cdn.form.io/formio.full.min.js"></script>
  <link rel="stylesheet" href="https://cdn.form.io/formio.full.min.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }
    h1, h2 {
      margin-top: 30px;
    }
    #builder, #preview {
      background: white;
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    #submissionData {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-family: monospace;
    }
    button {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🧱 Drag & Drop Form Builder</h1>

  <div id="builder"></div>

  <button id="showPreviewBtn" class="btn btn-primary mt-3">🔍 Δες Προεπισκόπηση</button>
  <button id="saveSchemaBtn" class="btn btn-secondary mt-3">💾 Αποθήκευση Φόρμας</button>
  <button id="loadSchemaBtn" class="btn btn-outline-secondary mt-3">📂 Φόρτωση Αποθηκευμένης</button>

  <h2>📋 Προεπισκόπηση Φόρμας</h2>
  <div id="preview"></div>

  <h2>📤 Δεδομένα Υποβολής</h2>
  <pre id="submissionData">[υποβλημένα δεδομένα]</pre>

  <script>
    let formSchema = {};

    // Δημιουργία Builder
    Formio.builder(document.getElementById('builder'), {}, {
      builder: {
        basic: true,
        advanced: true,
        layout: true,
        data: true
      }
    }).then(builder => {
      formSchema = builder.schema;

      builder.on('change', () => {
        formSchema = builder.schema;
      });

      document.getElementById('showPreviewBtn').addEventListener('click', () => {
        renderForm(formSchema);
      });

      document.getElementById('saveSchemaBtn').addEventListener('click', () => {
        localStorage.setItem('savedForm', JSON.stringify(formSchema));
        alert('✅ Η φόρμα αποθηκεύτηκε τοπικά!');
      });

      document.getElementById('loadSchemaBtn').addEventListener('click', () => {
        const saved = localStorage.getItem('savedForm');
        if (saved) {
          const parsed = JSON.parse(saved);
          builder.setForm(parsed);
          formSchema = parsed;
          alert('📂 Η φόρμα φορτώθηκε από αποθήκευση.');
        } else {
          alert('❌ Δεν υπάρχει αποθηκευμένη φόρμα.');
        }
      });
    });

    function renderForm(schema) {
      const preview = document.getElementById('preview');
      preview.innerHTML = ''; // καθαρισμός
      Formio.createForm(preview, schema).then(form => {
        form.on('submit', (submission) => {
          document.getElementById('submissionData').textContent = JSON.stringify(submission.data, null, 2);
        });
      });
    }
  </script>
</body>
</html>
