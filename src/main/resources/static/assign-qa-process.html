<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ανάθεση Διαδικασίας QA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #employeeSuggestions {
      position: absolute;
      z-index: 1000;
      width: 100%;
      background-color: white;
      border: 1px solid #ccc;
    }
    #employeeSuggestions li {
      padding: 8px;
      cursor: pointer;
    }
    #employeeSuggestions li:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4">📤 Ανάθεση Νέας QA Διαδικασίας</h2>
    <div class="mb-3">
      <button type="button" id="tabEmployee" class="btn btn-primary me-2">Υπάλληλος</button>
      <button type="button" id="tabGroup" class="btn btn-outline-primary">Group</button>
    </div>

    <form id="assignmentForm" class="row g-3 position-relative">

      <div class="col-md-6">
        <label for="processName" class="form-label">Ονομασία Διαδικασίας</label>
        <input type="text" class="form-control" id="processName" required>
      </div>

      <div id="employeeFields" class="row g-3">
        <div class="col-md-6 position-relative">
          <label for="employeeName" class="form-label">Ονοματεπώνυμο Υπαλλήλου</label>
          <input type="text" class="form-control" id="employeeName" autocomplete="off" required>
          <ul id="employeeSuggestions" class="list-group d-none"></ul>
        </div>
        <div class="col-md-6">
          <label for="employeePosition" class="form-label">Θέση Εργασίας</label>
          <input type="text" class="form-control" id="employeePosition" readonly>
        </div>
      </div>

      <div id="groupFields" class="row g-3 d-none">
        <div class="col-md-6">
          <label for="groupSelect" class="form-label">Όνομα Group Υπαλλήλων</label>
          <select id="groupSelect" class="form-select"></select>
        </div>
        <div class="col-md-6">
          <label for="groupMembers" class="form-label">Μέλη</label>
          <input type="text" class="form-control" id="groupMembers" readonly>
        </div>
      </div>

      <div class="col-md-12">
        <label for="description" class="form-label">Περιγραφή Διαδικασίας</label>
        <textarea class="form-control" id="description" rows="3" required></textarea>
      </div>

      <div class="col-md-6">
        <label for="bpmnFile" class="form-label">Αρχείο BPMN</label>
        <input type="file" class="form-control" id="bpmnFile" accept=".bpmn">
      </div>
      <div class="col-md-6">
        <label for="diagramSelect" class="form-label">Ή επιλέξτε αποθηκευμένο διάγραμμα</label>
        <select id="diagramSelect" class="form-select"></select>
      </div>

      <div class="col-md-12 d-flex justify-content-between">
        <a href="admin-dashboard.html" class="btn btn-secondary">⬅️ Πίσω</a>
        <button type="submit" class="btn btn-success">✅ Ανάθεση</button>
      </div>
    </form>

    <div id="responseMsg" class="mt-4 alert d-none"></div>
  </div>

  <script>
    let employeeList = [];
    let groupList = [];
    let activeTab = 'employee';

    async function loadDiagrams() {
      const res = await fetch('/api/bpmn?published=true');
      const diagrams = await res.json();
      const select = document.getElementById('diagramSelect');
      select.innerHTML = '<option value="">-- Επιλογή --</option>';
      diagrams.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.name;
        opt.textContent = d.name;
        select.appendChild(opt);
      });
    }

    async function loadEmployees() {
      const res = await fetch('/api/employees');
      employeeList = await res.json();
    }

    async function loadGroups() {
      const res = await fetch('/api/groups');
      groupList = await res.json();
      const select = document.getElementById('groupSelect');
      select.innerHTML = '<option value="">-- Επιλογή --</option>';
      groupList.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = g.name;
        select.appendChild(opt);
      });
      const urlParams = new URLSearchParams(window.location.search);
      const pre = urlParams.get('groupId');
      if (pre) {
        select.value = pre;
        updateGroupMembers();
        switchTab('group');
      }
    }

    function updateGroupMembers() {
      const select = document.getElementById('groupSelect');
      const group = groupList.find(g => g.id == select.value);
      document.getElementById('groupMembers').value = group ? group.members.map(m => m.fullName).join(', ') : '';
    }

    function switchTab(tab) {
      activeTab = tab;
      const btnEmp = document.getElementById('tabEmployee');
      const btnGrp = document.getElementById('tabGroup');
      const empFields = document.getElementById('employeeFields');
      const grpFields = document.getElementById('groupFields');

      if (tab === 'employee') {
        btnEmp.classList.add('btn-primary');
        btnEmp.classList.remove('btn-outline-primary');
        btnGrp.classList.remove('btn-primary');
        btnGrp.classList.add('btn-outline-primary');

        empFields.classList.remove('d-none');
        grpFields.classList.add('d-none');

        document.getElementById('employeeName').required = true;
        document.getElementById('groupSelect').required = false;
      } else {
        btnGrp.classList.add('btn-primary');
        btnGrp.classList.remove('btn-outline-primary');
        btnEmp.classList.remove('btn-primary');
        btnEmp.classList.add('btn-outline-primary');

        grpFields.classList.remove('d-none');
        empFields.classList.add('d-none');

        document.getElementById('employeeName').required = false;
        document.getElementById('groupSelect').required = true;
      }
    }

    document.getElementById('tabEmployee').addEventListener('click', () => switchTab('employee'));
    document.getElementById('tabGroup').addEventListener('click', () => switchTab('group'));
    document.getElementById('groupSelect').addEventListener('change', updateGroupMembers);

    document.getElementById('employeeName').addEventListener('input', function () {
      const input = this.value.toLowerCase();
      const suggestions = document.getElementById('employeeSuggestions');
      suggestions.innerHTML = '';

      if (!input) {
        suggestions.classList.add('d-none');
        return;
      }

      const matches = employeeList.filter(emp => emp.fullName.toLowerCase().includes(input));
      if (matches.length === 0) {
        suggestions.classList.add('d-none');
        return;
      }

      matches.forEach(emp => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.textContent = emp.fullName;
        li.addEventListener('click', () => {
          document.getElementById('employeeName').value = emp.fullName;
          document.getElementById('employeePosition').value = emp.position;
          suggestions.classList.add('d-none');
        });
        suggestions.appendChild(li);
      });

      suggestions.classList.remove('d-none');
    });

    document.addEventListener('click', function (e) {
      if (!document.getElementById('employeeName').contains(e.target)) {
        document.getElementById('employeeSuggestions').classList.add('d-none');
      }
    });

    document.getElementById('assignmentForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const formData = new FormData();
      formData.append('processName', document.getElementById('processName').value);
      formData.append('description', document.getElementById('description').value);
      const file = document.getElementById('bpmnFile').files[0];
      if (file) formData.append('bpmnFile', file);
      formData.append('diagramName', document.getElementById('diagramSelect').value);

      let url;
      if (activeTab === 'employee') {
        formData.append('employeeName', document.getElementById('employeeName').value);
        formData.append('employeePosition', document.getElementById('employeePosition').value);
        url = '/api/qa/assign';
      } else {
        formData.append('groupId', document.getElementById('groupSelect').value);
        url = '/api/qa/assign-group';
      }

      const response = await fetch(url, {
        method: 'POST',
        body: formData
      });

      const msg = document.getElementById('responseMsg');
      const data = await response.json();
      msg.classList.remove('d-none', 'alert-success', 'alert-danger');
      msg.classList.add(response.ok ? 'alert-success' : 'alert-danger');
      msg.textContent = response.ok
        ? '✅ Η διαδικασία ανατέθηκε επιτυχώς'
        : `❌ Σφάλμα: ${data.message || 'Αποτυχία ανάθεσης'}`;
    });

    loadEmployees();
    loadGroups();
    loadDiagrams();
  </script>
</body>
</html>
