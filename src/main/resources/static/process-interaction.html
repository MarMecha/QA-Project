<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Επικοινωνία Διαδικασίας</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">💬 Επικοινωνία Διαδικασίας</h1>
    <div class="mb-3">
      <label for="processId" class="form-label">ID Διαδικασίας</label>
      <input type="text" id="processId" class="form-control" placeholder="π.χ. 1">
      <button class="btn btn-primary mt-2" onclick="loadData()">Φόρτωσε</button>
    </div>

    <h2>Συζήτηση</h2>
    <ul id="chatList" class="list-group mb-3"></ul>
    <form id="chatForm" class="row g-2 mb-4">
      <div class="col-sm-3">
        <input type="text" id="chatSender" class="form-control" placeholder="Αποστολέας" required>
      </div>
      <div class="col-sm-7">
        <input type="text" id="chatMessage" class="form-control" placeholder="Μήνυμα" required>
      </div>
      <div class="col-sm-2 d-grid">
        <button class="btn btn-success" type="submit">Αποστολή</button>
      </div>
    </form>

    <h2>Σχόλια</h2>
    <ul id="commentList" class="list-group mb-3"></ul>
    <form id="commentForm" class="row g-2">
      <div class="col-sm-3">
        <input type="text" id="commentAuthor" class="form-control" placeholder="Συντάκτης" required>
      </div>
      <div class="col-sm-7">
        <input type="text" id="commentText" class="form-control" placeholder="Σχόλιο" required>
      </div>
      <div class="col-sm-2 d-grid">
        <button class="btn btn-success" type="submit">Υποβολή</button>
      </div>
    </form>

    <a href="employee-dashboard.html" class="btn btn-secondary mt-4">⬅️ Πίσω</a>
  </div>

  <script>
    async function loadData() {
      const pid = document.getElementById('processId').value;
      if (!pid) return;
      await Promise.all([loadChat(pid), loadComments(pid)]);
    }

    async function loadChat(pid) {
      const ul = document.getElementById('chatList');
      ul.innerHTML = '';
      try {
        const res = await fetch(`/api/chat/${pid}`);
        const data = await res.json();
        data.forEach(m => {
          const li = document.createElement('li');
          li.className = 'list-group-item';
          const when = m.sentAt ? m.sentAt.replace('T',' ').substring(0,16) : '';
          li.textContent = `[${when}] ${m.sender}: ${m.message}`;
          ul.appendChild(li);
        });
      } catch(err) {
        console.error(err);
      }
    }

    document.getElementById('chatForm').addEventListener('submit', async e => {
      e.preventDefault();
      const pid = document.getElementById('processId').value;
      const sender = document.getElementById('chatSender').value;
      const message = document.getElementById('chatMessage').value;
      await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ processId: pid, sender, message })
      });
      e.target.reset();
      loadChat(pid);
    });

    async function loadComments(pid) {
      const ul = document.getElementById('commentList');
      ul.innerHTML = '';
      try {
        const res = await fetch(`/api/comments/${pid}`);
        const data = await res.json();
        data.forEach(c => {
          const li = document.createElement('li');
          li.className = 'list-group-item';
          const when = c.createdAt ? c.createdAt.replace('T',' ').substring(0,16) : '';
          li.textContent = `[${when}] ${c.author}: ${c.text}`;
          ul.appendChild(li);
        });
      } catch(err) {
        console.error(err);
      }
    }

    document.getElementById('commentForm').addEventListener('submit', async e => {
      e.preventDefault();
      const pid = document.getElementById('processId').value;
      const author = document.getElementById('commentAuthor').value;
      const text = document.getElementById('commentText').value;
      await fetch('/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ processId: pid, author, text })
      });
      e.target.reset();
      loadComments(pid);
    });
  </script>
</body>
</html>
