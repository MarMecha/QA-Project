<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .notif-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 350px;
      height: 100vh;
      background: #f9f9f9;
      box-shadow: -2px 0 6px rgba(0,0,0,0.1);
      overflow-y: auto;
      transition: right 0.3s ease;
      padding: 1rem;
      z-index: 1050;
    }
    .notif-panel.open {
      right: 0;
    }
    .notif-panel h5 {
      margin-bottom: 1rem;
    }
    .notif-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1100;
    }
  </style>
</head>
<body class="bg-light">
  <button class="btn btn-outline-primary notif-btn" onclick="toggleNotifications()">
    🔔 <span id="notifBtnText">Ειδοποιήσεις</span>
    <span id="notifBadge" class="badge bg-danger ms-2" style="display: none;"></span>
  </button>


  <div class="notif-panel" id="notifPanel">
    <h5>📢 Ειδοποιήσεις</h5>
    <div id="notification-list">
      <p class="text-muted">Φόρτωση...</p>
    </div>
  </div>

  <div class="container py-4">
    <h1 class="mb-4">👤 Οι QA Διαδικασίες μου</h1>
    <div class="mb-3" id="userInfo"></div>

    <h2 class="mt-4">📋 Ατομικές Διαδικασίες</h2>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Διαδικασία</th>
          <th>Ημ/νία Ανάθεσης</th>
          <th>Διάγραμμα</th>
        </tr>
      </thead>
      <tbody id="assignedTable"></tbody>
    </table>

    <h2 class="mt-5">📋 Διαδικασίες Group</h2>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Διαδικασία</th>
          <th>Group</th>
          <th>Ημ/νία Ανάθεσης</th>
          <th>Διάγραμμα</th>
        </tr>
      </thead>
      <tbody id="assignedGroupTable"></tbody>
    </table>
  </div>

  <script>
    async function loadAssignments() {
      const userId = localStorage.getItem('employeeId');
      const res = await fetch(`/api/qa/employee/${userId}`);
      const data = await res.json();

      const indTable = document.getElementById('assignedTable');
      indTable.innerHTML = '';
      const individual = Array.isArray(data.assigned) ? data.assigned : [];
      if (individual.length === 0) {
        indTable.innerHTML = '<tr><td colspan="3" class="text-muted">Δεν υπάρχουν αναθέσεις.</td></tr>';
      } else {
        individual.forEach(p => {
          const link = p.bpmnFileName ? `<a href="modeler.html?name=${encodeURIComponent(p.bpmnFileName)}">${p.bpmnFileName}</a>` : '–';
          const row = `<tr>
            <td>${p.processName || '–'}</td>
            <td>${p.assignedAt ? p.assignedAt.replace('T',' ').substring(0,16) : '–'}</td>
            <td>${link}</td>
          </tr>`;
          indTable.innerHTML += row;
        });
      }

      const groupTable = document.getElementById('assignedGroupTable');
      groupTable.innerHTML = '';
      const group = Array.isArray(data.group) ? data.group : [];
      if (group.length === 0) {
        groupTable.innerHTML = '<tr><td colspan="4" class="text-muted">Δεν υπάρχουν αναθέσεις.</td></tr>';
      } else {
        group.forEach(p => {
          const link = p.bpmnFileName ? `<a href="modeler.html?name=${encodeURIComponent(p.bpmnFileName)}">${p.bpmnFileName}</a>` : '–';
          const row = `<tr>
            <td>${p.processName || '–'}</td>
            <td>${p.groupName || '–'}</td>
            <td>${p.assignedAt ? p.assignedAt.replace('T',' ').substring(0,16) : '–'}</td>
            <td>${link}</td>
          </tr>`;
          groupTable.innerHTML += row;
        });
      }
    }

    async function loadNotifications() {
      const name = localStorage.getItem('employeeName');
      const panel = document.getElementById("notification-list");
      panel.innerHTML = "<p class='text-muted'>⏳ Φόρτωση...</p>";

      try {
        const res = await fetch(`/api/notifications?user=${encodeURIComponent(name)}`);
        const data = await res.json();

        if (data.length === 0) {
          panel.innerHTML = "<p class='text-muted'>Δεν υπάρχουν ειδοποιήσεις.</p>";
        } else {
          panel.innerHTML = "";
          data.forEach(n => {
            const link = document.createElement("a");
            link.href = `modeler.html?name=${encodeURIComponent(n.diagram)}`;
            link.className = "list-group-item list-group-item-action";
            link.textContent = n.message;
            panel.appendChild(link);
          });
        }
      } catch (e) {
        panel.innerHTML = "<p class='text-danger'>⚠️ Σφάλμα φόρτωσης ειδοποιήσεων.</p>";
      }
    }


    function toggleNotifications() {
      const panel = document.getElementById('notifPanel');
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) {
        loadNotifications();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const name = localStorage.getItem('employeeName');
      const info = document.getElementById('userInfo');
      if (!name) {
        window.location.href = 'login.html';
        return;
      }
      info.textContent = `Χρήστης: ${name}`;
      loadAssignments();
    });
  </script>
</body>
</html>
