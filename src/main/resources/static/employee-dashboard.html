<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/notifications.css" />

  <style>
    /* Keep table compact and prevent stretching by long descriptions */
    table { table-layout: fixed; }

    /* 2nd column is the description; adjust width as you like */
    th:nth-child(2), td:nth-child(2) { width: 32%; }

    /* Two-line ellipsis for description preview */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: normal;
      word-break: break-word;
    }

    .desc-trigger { cursor: pointer; }
  </style>
</head>
<body class="bg-light">

  <!-- Top buttons -->
  <button class="btn btn-outline-primary notif-btn navbar-msg" onclick="toggleMessages()">
    💬 <span id="msgBtnText">Μηνύματα</span>
    <span id="msgBadge" class="badge bg-danger ms-2" style="display: none;"></span>
  </button>
  <button class="btn btn-outline-primary notif-btn navbar-bell" onclick="toggleNotifications()">
    🔔 <span id="notifBtnText">Ειδοποιήσεις</span>
    <span id="notifBadge" class="badge bg-danger ms-2" style="display: none;"></span>
  </button>

  <!-- Panels -->
  <div class="notif-panel" id="msgPanel">
    <h5>💬 Μηνύματα</h5>
    <div id="message-list">
      <p class="text-muted">Φόρτωση...</p>
    </div>
  </div>

  <div class="notif-panel" id="notifPanel">
    <h5>📢 Ειδοποιήσεις</h5>
    <div id="notification-list">
      <p class="text-muted">Φόρτωση...</p>
    </div>
  </div>

  <!-- Main content -->
  <div class="container py-4">
    <h1 class="mb-4">👤 Οι QA Διαδικασίες μου</h1>
    <div class="mb-3" id="userInfo"></div>

    <h2 class="mt-4">📋 Ατομικές Διαδικασίες</h2>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Διαδικασία</th>
          <th>Περιγραφή</th>
          <th>Ημ/νία Ανάθεσης</th>
          <th>Διάγραμμα</th>
        </tr>
      </thead>
      <tbody id="assignedTable"></tbody>
    </table>

    <h2 class="mt-5">📋 Διαδικασίες Group</h2>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Διαδικασία</th>
          <th>Περιγραφή</th>
          <th>Group</th>
          <th>Ημ/νία Ανάθεσης</th>
          <th>Διάγραμμα</th>
        </tr>
      </thead>
      <tbody id="assignedGroupTable"></tbody>
    </table>
  </div>

  <!-- Description Modal -->
  <div class="modal fade" id="descModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Περιγραφή</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Κλείσιμο"></button>
        </div>
        <div class="modal-body">
          <pre class="mb-0" id="descModalBody" style="white-space: pre-wrap;"></pre>
        </div>
      </div>
    </div>
  </div>

  <!-- App scripts -->
  <script>
    // Escape HTML to avoid breaking attributes / XSS
    function esc(s){ 
      return (s ?? '').toString().replace(/[&<>"']/g, m => (
        {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
      ));
    }

    // Build the description cell: 2-line preview + click to open modal
    function descCellHtml(desc) {
      const safe = esc(desc || '–');
      return `
        <td>
          <a class="text-body text-decoration-none desc-trigger" data-desc="${safe}">
            <span class="line-clamp-2">${safe}</span>
          </a>
        </td>
      `;
    }

    async function loadAssignments() {
      const userId = localStorage.getItem('employeeId');
      const res = await fetch(`/api/qa/employee/${userId}`);
      const data = await res.json();

      // Individual
      const indTable = document.getElementById('assignedTable');
      indTable.innerHTML = '';
      const individual = Array.isArray(data.assigned) ? data.assigned : [];
      if (individual.length === 0) {
        indTable.innerHTML = '<tr><td colspan="4" class="text-muted">Δεν υπάρχουν αναθέσεις.</td></tr>';
      } else {
        individual.forEach(p => {
          const link = p.bpmnFileName
            ? `<a href="modeler.html?name=${encodeURIComponent(p.bpmnFileName)}">${esc(p.bpmnFileName)}</a>`
            : '–';
          const row = `<tr>
            <td>${esc(p.processName) || '–'}</td>
            ${descCellHtml(p.description)}
            <td>${p.assignedAt ? esc(p.assignedAt.replace('T',' ').substring(0,16)) : '–'}</td>
            <td>${link}</td>
          </tr>`;
          indTable.insertAdjacentHTML('beforeend', row);
        });
      }

      // Group
      const groupTable = document.getElementById('assignedGroupTable');
      groupTable.innerHTML = '';
      const group = Array.isArray(data.group) ? data.group : [];
      if (group.length === 0) {
        groupTable.innerHTML = '<tr><td colspan="5" class="text-muted">Δεν υπάρχουν αναθέσεις.</td></tr>';
      } else {
        group.forEach(p => {
          const link = p.bpmnFileName
            ? `<a href="modeler.html?name=${encodeURIComponent(p.bpmnFileName)}">${esc(p.bpmnFileName)}</a>`
            : '–';
          const row = `<tr>
            <td>${esc(p.processName) || '–'}</td>
            ${descCellHtml(p.description)}
            <td>${esc(p.groupName) || '–'}</td>
            <td>${p.assignedAt ? esc(p.assignedAt.replace('T',' ').substring(0,16)) : '–'}</td>
            <td>${link}</td>
          </tr>`;
          groupTable.insertAdjacentHTML('beforeend', row);
        });
      }
    }

    // Delegated click: open modal with full description
    document.addEventListener('click', (e) => {
      const a = e.target.closest('.desc-trigger');
      if (!a) return;
      e.preventDefault();
      const full = a.getAttribute('data-desc') || '';
      document.getElementById('descModalBody').textContent = full;
      new bootstrap.Modal(document.getElementById('descModal')).show();
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      const name = localStorage.getItem('employeeName');
      const info = document.getElementById('userInfo');
      if (!name) {
        window.location.href = 'login.html';
        return;
      }
      info.textContent = `Χρήστης: ${name}`;
      loadAssignments();
    });
  </script>

  <!-- Your existing modules -->
  <script src="js/message-notifications.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Bootstrap JS (bundle includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
