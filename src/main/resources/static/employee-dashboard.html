<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">👤 Εκχωρημένες Διαδικασίες</h1>

    <div class="mb-3">
      <label for="userId" class="form-label">User ID</label>
      <input type="text" id="userId" class="form-control" placeholder="π.χ. employee123" />
      <button class="btn btn-primary mt-2" onclick="loadAssignments()">Φόρτωσε Διαδικασίες</button>
    </div>

    <table class="table table-bordered">
      <thead>
        <tr>
          <th>ID</th>
          <th>Όνομα Διαδικασίας</th>
          <th>Κατάσταση</th>
          <th>Έναρξη</th>
        </tr>
      </thead>
      <tbody id="assignmentTable"></tbody>
    </table>
  </div>

  <script>
    async function loadAssignments() {
      const userId = document.getElementById("userId").value;
      const table = document.getElementById("assignmentTable");
      table.innerHTML = "";
      try {
        const res = await fetch(`/api/instances/user/${userId}`);
        const data = await res.json();

        if (!Array.isArray(data)) {
          table.innerHTML = '<tr><td colspan="4">❌ Σφάλμα στη λήψη</td></tr>';
          return;
        }

        data.forEach(item => {
          const row = `<tr>
            <td>${item.id}</td>
            <td>${item.processName || '–'}</td>
            <td>${item.status || '–'}</td>
            <td>${item.startedAt || '–'}</td>
          </tr>`;
          table.innerHTML += row;
        });
      } catch (err) {
        console.error("Error:", err);
        table.innerHTML = '<tr><td colspan="4">❌ Σφάλμα σύνδεσης</td></tr>';
      }
    }
  </script>
</body>
</html>
