spring.application.name=QA_Project

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/qa_project_db
spring.datasource.username=postgres
spring.datasource.password=

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Server port (προαιρετικό)
server.port=8080

# JWT settings
app.jwt.secret=change-this-development-secret-key-32-chars-min
app.jwt.expiration-ms=28800000
